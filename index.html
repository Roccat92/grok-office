<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Grok Office</title>
<link rel="icon" href="data:,">
<style>
  /* NEXA DevHub design tokens (Roccat92/nexa-devhub packages/ui/src/tokens.css): black & gold */
  :root { --color-bg:#080B0B; --color-surface:#121212; --color-elevated:#1a1a1a; --color-raised:#222222; --color-line:#2a2a2a; --color-line-soft:#1e1e1e;
          --color-fg:#f5f5f5; --color-fg-muted:#a3a3a3; --color-fg-faint:#6e6e6e; --color-accent:#ffc629; --color-accent-2:#ffd873; --color-on-accent:#080B0B;
          --color-ok:#43c59e; --color-warn:#f2a93b; --color-err:#f17b82; --color-info:#7cb7ff;
          --font-sans:"Geist Variable","Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-mono:"Geist Mono Variable","JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
          --radius-sm:8px; --radius-md:10px; --radius-lg:12px; --radius-xl:16px; --ease-out:cubic-bezier(.22,1,.36,1);
          --shadow-soft:0 1px 0 0 rgb(255 255 255 / .03) inset, 0 8px 24px -14px rgb(0 0 0 / .7); --shadow-pop:0 1px 0 0 rgb(255 255 255 / .05) inset, 0 20px 50px -18px rgb(0 0 0 / .85);
          --side-w:350px; --sheet-h:0px;
          --c-working:var(--color-ok); --c-idle:var(--color-fg-muted); --c-meeting:var(--color-info); --c-blocked:var(--color-err); --c-done:var(--color-accent); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--color-bg); font-family:var(--font-sans); color:var(--color-fg); -webkit-font-smoothing:antialiased; }
  ::selection { background:rgba(255,198,41,.35); }
  :focus-visible { outline:2px solid var(--color-accent); outline-offset:2px; }
  .panel { background:rgba(18,18,18,.86); -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); }
  .btn { background:var(--color-elevated); color:var(--color-fg); border:1px solid var(--color-line); border-radius:var(--radius-md); font-family:inherit; font-weight:600; cursor:pointer; transition:background .15s var(--ease-out), border-color .15s var(--ease-out), color .15s; }
  .btn:hover { border-color:rgba(255,198,41,.6); color:var(--color-accent); }
  .btn.primary { background:var(--color-accent); color:var(--color-on-accent); border-color:var(--color-accent); }
  .btn.primary:hover { background:var(--color-accent-2); color:var(--color-on-accent); }
  #stage { position:fixed; left:0; top:0; right:var(--side-w); bottom:var(--sheet-h); overflow:hidden; }
  #sky, #stars { position:absolute; inset:0; pointer-events:none; } #stars { opacity:0; }
  #skyline, #skywin { position:absolute; left:0; right:0; top:0; pointer-events:none; background-size:auto 100%; background-position:center bottom; background-repeat:repeat-x; -webkit-mask-size:auto 100%; mask-size:auto 100%; -webkit-mask-position:center bottom; mask-position:center bottom; -webkit-mask-repeat:repeat-x; mask-repeat:repeat-x; display:none; }
  #skywin { opacity:0; }
  #sun, #moon { position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; pointer-events:none; display:none; }
  #sun { background:radial-gradient(circle, #fffbe0 0 38%, #ffe27a 52%, rgba(255,214,110,.35) 62%, rgba(255,214,110,0) 72%); }
  #moon { width:44px; height:44px; margin:-22px 0 0 -22px; background:radial-gradient(circle at 36% 34%, #fffdf2, #d9dcec 70%); box-shadow:0 0 26px 8px rgba(190,205,255,.35); }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #brand { position:absolute; left:18px; top:12px; pointer-events:none; color:var(--color-accent); z-index:3; padding:6px 12px 7px; border-radius:var(--radius-lg); background:rgba(8,11,11,.62); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.06); }
  #brand h1 { margin:0; font-weight:800; letter-spacing:-.5px; font-size:clamp(22px,3vw,34px); line-height:1; }
  #brand small { display:block; margin-top:4px; font-size:clamp(9px,1.1vw,11px); letter-spacing:2.5px; text-transform:uppercase; color:var(--color-fg-muted); }
  #hud { position:absolute; left:50%; top:10px; transform:translateX(-50%); display:flex; align-items:center; gap:14px; padding:7px 14px; font-size:clamp(11px,1.2vw,13px); white-space:nowrap; z-index:3; }
  #hud .sep { width:1px; height:16px; background:var(--color-line); }
  #hud b { font-family:var(--font-mono); font-size:clamp(13px,1.5vw,17px); letter-spacing:.5px; color:var(--color-accent); font-weight:700; }
  #dot { width:11px; height:11px; border-radius:50%; background:var(--color-ok); box-shadow:0 0 8px currentColor; color:var(--color-ok); display:inline-block; vertical-align:-1px; margin-right:6px; }
  #dot.stale { background:var(--color-warn); color:var(--color-warn); } #dot.err { background:var(--color-err); color:var(--color-err); }
  #zoomctl { position:absolute; right:12px; top:12px; display:flex; gap:6px; align-items:center; z-index:3; }
  #zoomctl .btn { height:32px; min-width:32px; padding:0 10px; font-size:15px; line-height:1; touch-action:manipulation; }
  #overview { font-size:11.5px; letter-spacing:1px; font-weight:800; }
  #legend { position:absolute; left:14px; bottom:12px; padding:7px 10px; font-size:11px; line-height:1.6; display:flex; gap:10px; flex-wrap:wrap; max-width:60%; z-index:3; pointer-events:none; }
  #legend i, .badge i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:0; }
  #toasts { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; z-index:4; pointer-events:none; }
  .toast { padding:8px 14px; font-size:13px; border-left:3px solid var(--color-accent); animation:toast 6s ease-out forwards; max-width:90vw; text-align:center; }
  @keyframes toast { 0%{opacity:0;transform:translateY(10px)} 6%{opacity:1;transform:none} 85%{opacity:1} 100%{opacity:0} }

  .bub { position:absolute; left:0; top:0; max-width:165px; min-width:50px; padding:5px 9px 6px; border-radius:var(--radius-md); background:rgba(18,18,18,.94); color:var(--color-fg); font-size:11.5px; line-height:1.25; border:1px solid var(--color-line); border-left:4px solid var(--bc,#999); box-shadow:var(--shadow-pop); pointer-events:auto; cursor:pointer; will-change:transform; }
  #leaders { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #leaders line { stroke:rgba(255,198,41,.8); stroke-width:1.5; stroke-dasharray:3 2; transition:opacity .2s; }
  .bub::after { content:""; position:absolute; left:var(--tx,50%); bottom:-6px; width:10px; height:10px; background:inherit; transform:translateX(-50%) rotate(45deg); }
  .bub b { display:block; font-size:11px; letter-spacing:.4px; color:var(--bc); filter:brightness(1.35) saturate(1.1); }
  .bub span { color:var(--color-fg-muted); }
  .bub span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bub.compact span { display:none; } .bub.compact:hover span { display:-webkit-box; }
  .bub.sel { outline:2px solid var(--color-accent); z-index:5; }
  .bub.sel span { color:var(--color-fg); }
  .bub.blocked { background:#241517; border-color:#4a2427; }
  .bub.pop { animation:bpop .6s ease-out; }
  @keyframes bpop { 0%{transform:scale(.6)} 55%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .bub .ico { position:absolute; right:-9px; top:-11px; width:20px; height:20px; border-radius:50%; font-weight:800; font-size:13px; line-height:20px; text-align:center; color:#fff; display:none; }
  .bub.blocked .ico { display:block; background:var(--color-err); color:var(--color-on-accent); animation:throb .9s infinite; }
  .bub.done .ico { display:block; background:var(--color-accent); color:var(--color-on-accent); }
  @keyframes throb { 50%{transform:scale(1.25)} }

  #side { position:fixed; right:0; top:0; bottom:0; width:var(--side-w); border-radius:0; border-width:0 0 0 1px; background:rgba(18,18,18,.97); display:flex; flex-direction:column; z-index:6; }
  #side header { padding:14px 16px 8px; display:flex; align-items:baseline; justify-content:space-between; }
  #side header h2 { margin:0; font-size:19px; font-weight:800; letter-spacing:-.3px; }
  #side header h2::before { content:''; display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--color-accent); margin-right:9px; vertical-align:2px; }
  #side header small { color:var(--color-fg-faint); font-size:11px; letter-spacing:1px; font-family:var(--font-mono); }
  #sheetToggle { display:none; }
  #list { overflow-y:auto; padding:4px 10px 10px; flex:1; }
  .row { background:var(--color-elevated); border:1px solid var(--color-line-soft); border-radius:var(--radius-md); padding:9px 10px; margin-bottom:8px; border-left:4px solid var(--bc); cursor:pointer; transition:background .2s var(--ease-out), border-color .2s; }
  .row:hover { background:var(--color-raised); }
  .row.sel { background:rgba(255,198,41,.09); border-color:rgba(255,198,41,.55); }
  .row.flash { animation:flash 1.6s ease-out; }
  @keyframes flash { 0%{background:rgba(255,198,41,.45)} 100%{background:var(--color-elevated)} }
  .row .top { display:flex; align-items:center; gap:8px; }
  .row .nm { font-weight:700; font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:10.5px; font-weight:700; letter-spacing:.4px; padding:2px 8px; border-radius:20px; background:var(--color-bg); border:1px solid var(--color-line); white-space:nowrap; }
  .row .role { font-size:11px; color:var(--color-fg-faint); margin-top:1px; }
  .row .task { font-size:12.5px; margin-top:5px; line-height:1.3; }
  .row .meta { font-size:11px; color:var(--color-fg-muted); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { background:rgba(255,198,41,.12); color:var(--color-accent-2); padding:1px 7px; border-radius:6px; font-family:var(--font-mono); font-size:10.5px; }
  .row .lg { font-size:10.5px; color:var(--color-fg-faint); margin-top:3px; line-height:1.3; }
  .bar { height:5px; background:var(--color-bg); border-radius:3px; overflow:hidden; margin-top:5px; }
  .bar i { display:block; height:100%; background:var(--color-accent); transition:width .6s; }
  #groups h3 { margin:12px 4px 6px; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--color-fg-faint); }
  .grp { background:var(--color-elevated); border:1px solid var(--color-line-soft); border-radius:var(--radius-md); padding:8px 10px; margin-bottom:8px; font-size:12px; }
  .grp b { font-size:13px; } .grp .mem { margin-top:5px; display:flex; gap:5px; flex-wrap:wrap; }
  .mem span { padding:1px 7px; border-radius:6px; color:var(--color-on-accent); font-weight:700; font-size:10.5px; }

  #detail { position:absolute; left:14px; bottom:54px; width:min(330px,calc(100% - 28px)); padding:12px 14px; z-index:4; display:none; max-height:55%; overflow:auto; }
  #detail.on { display:block; }
  #detail h3 { margin:0; font-size:19px; font-weight:800; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #detail .x { cursor:pointer; font-size:18px; color:var(--color-fg-muted); padding:0 4px; } #detail .x:hover { color:var(--color-accent); }
  #detail .kv { font-size:12px; margin-top:6px; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; }
  #detail .kv span:nth-child(odd) { color:var(--color-fg-faint); }
  #detail .task { margin:8px 0 4px; font-size:14px; line-height:1.35; }
  #detail .lgs { margin-top:8px; font-size:11.5px; line-height:1.4; border-top:1px solid var(--color-line); padding-top:6px; }
  #detail .lgs div { margin-bottom:3px; } #detail .lgs em { color:var(--color-fg-faint); font-style:normal; font-family:var(--font-mono); }

  @media (max-width:1500px) and (min-width:761px) { #hud { left:18px; top:74px; transform:none; } }
  @media (max-width:760px) {
    :root { --side-w:0px; --sheet-h:38vh; }
    body.collapsed { --sheet-h:54px; }
    #side { right:0; left:0; top:auto; bottom:0; width:auto; height:var(--sheet-h); border-width:1px 0 0 0; border-radius:var(--radius-xl) var(--radius-xl) 0 0; }
    #sheetToggle { display:block; background:none; border:0; color:var(--color-accent); font-size:20px; padding:0 4px; font-family:inherit; }
    #side header { padding:10px 14px 4px; }
    body.collapsed #list, body.collapsed #groups { display:none; }
    #hud { top:auto; bottom:8px; left:50%; font-size:10px; gap:8px; padding:5px 9px; }
    #hud .hide-m { display:none; }
    #legend { display:none; }
    #brand h1 { font-size:20px; } #brand { padding:4px 9px 5px; left:10px; top:10px; }
    #zoomctl { top:10px; right:10px; } #zoomctl .btn { height:30px; min-width:30px; padding:0 8px; }
    #brand small { display:none; }
    #detail { bottom:46px; left:8px; width:calc(100% - 16px); max-height:48%; padding:9px 11px; }
    #toasts { bottom:50px; }
    .bub { max-width:130px; font-size:10px; padding:3px 6px 4px; }
  }
  noscript { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--color-accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div><div id="stars"></div><div id="sun"></div><div id="moon"></div><div id="skyline"></div><div id="skywin"></div>
  <canvas id="gl"></canvas>
  <svg id="leaders"></svg>
  <div id="labels"></div>
  <div id="brand"><h1>Grok Office</h1><small>Văn phòng của các Grok Bot</small></div>
  <div id="hud" class="panel">
    <span><span class="hide-m">Giờ Bangkok </span><b id="clock">--:--:--</b></span><span class="sep"></span>
    <span><i id="dot" title="Đang kết nối..."></i><span id="upd">Cập nhật lúc --:--:--</span></span>
    <span class="sep hide-m"></span><span class="hide-m" id="dataAge"></span>
  </div>
  <div id="zoomctl"><button id="zin" class="btn panel" aria-label="Phóng to" title="Phóng to">+</button><button id="zout" class="btn panel" aria-label="Thu nhỏ" title="Thu nhỏ">&minus;</button><button id="overview" class="btn primary" title="Về toàn cảnh (nhấp đúp vào cảnh cũng được)">TOÀN CẢNH</button></div>
  <div id="legend" class="panel">
    <span><i style="background:var(--c-working)"></i>Đang làm</span><span><i style="background:var(--c-idle)"></i>Rảnh</span>
    <span><i style="background:var(--c-meeting)"></i>Họp</span><span><i style="background:var(--c-blocked)"></i>Bị chặn</span><span><i style="background:var(--c-done)"></i>Xong</span>
  </div>
  <div id="detail" class="panel"></div>
  <div id="toasts"></div>
</div>
<aside id="side" class="panel">
  <header><h2>Đội bot <small id="count"></small></h2><button id="sheetToggle" aria-label="Thu gọn">&#9662;</button></header>
  <div id="list"></div>
  <div id="groups" style="padding:0 10px 12px"></div>
</aside>
<noscript>Cần bật JavaScript để xem Grok Office.</noscript>
<script type="module" src="office.js"></script>
</body>
</html>
