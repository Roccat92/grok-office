<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Grok Office</title>
<link rel="icon" href="data:,">
<style>
  :root { --green:#1f5a3a; --green2:#18462e; --cream:#EDE8DF; --side-w:350px; --sheet-h:0px;
          --c-working:#5ad07a; --c-idle:#a7b2ac; --c-meeting:#5aa9ff; --c-blocked:#ff5a4d; --c-done:#e8ff5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--cream); font-family:"Trebuchet MS",Verdana,sans-serif; color:#fff; }
  .panel { background:rgba(24,70,46,.93); border:2px solid #0f3d27; border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #stage { position:fixed; left:0; top:0; right:var(--side-w); bottom:var(--sheet-h); overflow:hidden; }
  #sky, #stars { position:absolute; inset:0; pointer-events:none; } #stars { opacity:0; }
  #skyline, #skywin { position:absolute; left:0; right:0; top:0; pointer-events:none; background-size:auto 100%; background-position:center bottom; background-repeat:repeat-x; -webkit-mask-size:auto 100%; mask-size:auto 100%; -webkit-mask-position:center bottom; mask-position:center bottom; -webkit-mask-repeat:repeat-x; mask-repeat:repeat-x; display:none; }
  #skywin { opacity:0; }
  #sun, #moon { position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; pointer-events:none; display:none; }
  #sun { background:radial-gradient(circle, #fffbe0 0 38%, #ffe27a 52%, rgba(255,214,110,.35) 62%, rgba(255,214,110,0) 72%); }
  #moon { width:44px; height:44px; margin:-22px 0 0 -22px; background:radial-gradient(circle at 36% 34%, #fffdf2, #d9dcec 70%); box-shadow:0 0 26px 8px rgba(190,205,255,.35); }
  body.dark #brand { color:#f3f0e4; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #brand { position:absolute; left:18px; top:12px; pointer-events:none; color:#17402a; z-index:3; }
  #brand h1 { margin:0; font-family:Georgia,"Times New Roman",serif; font-style:italic; font-weight:700; font-size:clamp(24px,3.4vw,42px); line-height:1; }
  #brand small { display:block; margin-top:4px; font-size:clamp(9px,1.1vw,12px); letter-spacing:3px; text-transform:uppercase; opacity:.7; }
  #hud { position:absolute; left:50%; top:10px; transform:translateX(-50%); display:flex; align-items:center; gap:14px; padding:7px 14px; font-size:clamp(11px,1.2vw,13px); white-space:nowrap; z-index:3; }
  #hud .sep { width:1px; height:16px; background:rgba(255,255,255,.3); }
  #hud b { font-family:Georgia,serif; font-size:clamp(14px,1.6vw,18px); letter-spacing:1px; }
  #dot { width:11px; height:11px; border-radius:50%; background:#5ad07a; box-shadow:0 0 8px currentColor; color:#5ad07a; display:inline-block; vertical-align:-1px; margin-right:6px; }
  #dot.stale { background:#ffb53d; color:#ffb53d; } #dot.err { background:#ff5a4d; color:#ff5a4d; }
  #overview { position:absolute; right:12px; top:12px; padding:7px 12px; font-size:12px; letter-spacing:1px; font-weight:700; cursor:pointer; z-index:3; border:2px solid #0f3d27; color:#fff; font-family:inherit; }
  #legend { position:absolute; left:14px; bottom:12px; padding:7px 10px; font-size:11px; line-height:1.6; display:flex; gap:10px; flex-wrap:wrap; max-width:60%; z-index:3; pointer-events:none; }
  #legend i, .badge i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:0; }
  #toasts { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; z-index:4; pointer-events:none; }
  .toast { padding:7px 14px; font-size:13px; animation:toast 6s ease-out forwards; max-width:90vw; text-align:center; }
  @keyframes toast { 0%{opacity:0;transform:translateY(10px)} 6%{opacity:1;transform:none} 85%{opacity:1} 100%{opacity:0} }

  .bub { position:absolute; left:0; top:0; max-width:165px; min-width:50px; padding:5px 9px 6px; border-radius:9px; background:rgba(255,255,255,.96); color:#17402a; font-size:11.5px; line-height:1.25; border-left:5px solid var(--bc,#999); box-shadow:0 2px 8px rgba(0,0,0,.25); pointer-events:auto; cursor:pointer; will-change:transform; }
  #leaders { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #leaders line { stroke:rgba(23,64,42,.65); stroke-width:1.5; stroke-dasharray:3 2; transition:opacity .2s; }
  .bub::after { content:""; position:absolute; left:var(--tx,50%); bottom:-6px; width:10px; height:10px; background:inherit; transform:translateX(-50%) rotate(45deg); }
  .bub b { display:block; font-size:11px; letter-spacing:.5px; color:var(--bc); filter:brightness(.7); }
  .bub span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bub.compact span { display:none; } .bub.compact:hover span { display:-webkit-box; }
  .bub.sel { outline:2px solid #e8ff5a; z-index:5; }
  .bub.blocked { background:#fff0ee; }
  .bub.pop { animation:bpop .6s ease-out; }
  @keyframes bpop { 0%{transform:scale(.6)} 55%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .bub .ico { position:absolute; right:-9px; top:-11px; width:20px; height:20px; border-radius:50%; font-weight:800; font-size:13px; line-height:20px; text-align:center; color:#fff; display:none; }
  .bub.blocked .ico { display:block; background:#e0382b; animation:throb .9s infinite; }
  .bub.done .ico { display:block; background:#2fa653; }
  @keyframes throb { 50%{transform:scale(1.25)} }

  #side { position:fixed; right:0; top:0; bottom:0; width:var(--side-w); border-radius:0; border-width:0 0 0 2px; display:flex; flex-direction:column; z-index:6; }
  #side header { padding:14px 16px 8px; display:flex; align-items:baseline; justify-content:space-between; }
  #side header h2 { margin:0; font-family:Georgia,serif; font-style:italic; font-size:22px; }
  #side header small { opacity:.7; font-size:11px; letter-spacing:1px; }
  #sheetToggle { display:none; }
  #list { overflow-y:auto; padding:4px 10px 10px; flex:1; }
  .row { background:rgba(0,0,0,.18); border-radius:9px; padding:9px 10px; margin-bottom:8px; border-left:5px solid var(--bc); cursor:pointer; transition:background .2s; }
  .row:hover { background:rgba(0,0,0,.3); }
  .row.sel { background:rgba(232,255,90,.14); outline:1px solid #e8ff5a; }
  .row.flash { animation:flash 1.6s ease-out; }
  @keyframes flash { 0%{background:rgba(232,255,90,.6)} 100%{background:rgba(0,0,0,.18)} }
  .row .top { display:flex; align-items:center; gap:8px; }
  .row .nm { font-weight:700; font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:10.5px; font-weight:700; letter-spacing:.5px; padding:2px 8px; border-radius:20px; background:rgba(0,0,0,.28); white-space:nowrap; }
  .row .role { font-size:11px; opacity:.65; margin-top:1px; }
  .row .task { font-size:12.5px; margin-top:5px; line-height:1.3; }
  .row .meta { font-size:11px; opacity:.75; margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { background:rgba(255,255,255,.14); padding:1px 7px; border-radius:6px; }
  .row .lg { font-size:10.5px; opacity:.6; margin-top:3px; line-height:1.3; }
  .bar { height:5px; background:rgba(0,0,0,.35); border-radius:3px; overflow:hidden; margin-top:5px; }
  .bar i { display:block; height:100%; background:#e8ff5a; transition:width .6s; }
  #groups h3 { margin:12px 4px 6px; font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:.7; }
  .grp { background:rgba(0,0,0,.18); border-radius:9px; padding:8px 10px; margin-bottom:8px; font-size:12px; }
  .grp b { font-size:13px; } .grp .mem { margin-top:5px; display:flex; gap:5px; flex-wrap:wrap; }
  .mem span { padding:1px 7px; border-radius:6px; color:#102; font-weight:700; font-size:10.5px; }

  #detail { position:absolute; left:14px; bottom:54px; width:min(330px,calc(100% - 28px)); padding:12px 14px; z-index:4; display:none; max-height:55%; overflow:auto; }
  #detail.on { display:block; }
  #detail h3 { margin:0; font-family:Georgia,serif; font-style:italic; font-size:22px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #detail .x { cursor:pointer; font-style:normal; font-size:18px; opacity:.8; padding:0 4px; }
  #detail .kv { font-size:12px; margin-top:6px; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; }
  #detail .kv span:nth-child(odd) { opacity:.65; }
  #detail .task { margin:8px 0 4px; font-size:14px; line-height:1.35; }
  #detail .lgs { margin-top:8px; font-size:11.5px; line-height:1.4; border-top:1px solid rgba(255,255,255,.2); padding-top:6px; }
  #detail .lgs div { margin-bottom:3px; } #detail .lgs em { opacity:.6; font-style:normal; }

  @media (max-width:1500px) and (min-width:761px) { #hud { left:18px; top:74px; transform:none; } }
  @media (max-width:760px) {
    :root { --side-w:0px; --sheet-h:38vh; }
    body.collapsed { --sheet-h:54px; }
    #side { right:0; left:0; top:auto; bottom:0; width:auto; height:var(--sheet-h); border-width:2px 0 0 0; border-radius:14px 14px 0 0; }
    #sheetToggle { display:block; background:none; border:0; color:#fff; font-size:20px; padding:0 4px; font-family:inherit; }
    #side header { padding:10px 14px 4px; }
    body.collapsed #list, body.collapsed #groups { display:none; }
    #hud { top:auto; bottom:8px; left:50%; font-size:10px; gap:8px; padding:5px 9px; }
    #hud .hide-m { display:none; }
    #legend { display:none; }
    #brand h1 { font-size:22px; }
    #brand small { display:none; }
    #detail { bottom:46px; left:8px; width:calc(100% - 16px); max-height:48%; padding:9px 11px; }
    #toasts { bottom:50px; }
    .bub { max-width:130px; font-size:10px; padding:3px 6px 4px; }
  }
  noscript { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#17402a; }
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div><div id="stars"></div><div id="sun"></div><div id="moon"></div><div id="skyline"></div><div id="skywin"></div>
  <canvas id="gl"></canvas>
  <svg id="leaders"></svg>
  <div id="labels"></div>
  <div id="brand"><h1>Grok Office</h1><small>Văn phòng của các Grok Bot</small></div>
  <div id="hud" class="panel">
    <span><span class="hide-m">Giờ Bangkok </span><b id="clock">--:--:--</b></span><span class="sep"></span>
    <span><i id="dot" title="Đang kết nối..."></i><span id="upd">Cập nhật lúc --:--:--</span></span>
    <span class="sep hide-m"></span><span class="hide-m" id="dataAge"></span>
  </div>
  <button id="overview" class="panel">TOÀN CẢNH</button>
  <div id="legend" class="panel">
    <span><i style="background:var(--c-working)"></i>Đang làm</span><span><i style="background:var(--c-idle)"></i>Rảnh</span>
    <span><i style="background:var(--c-meeting)"></i>Họp</span><span><i style="background:var(--c-blocked)"></i>Bị chặn</span><span><i style="background:var(--c-done)"></i>Xong</span>
  </div>
  <div id="detail" class="panel"></div>
  <div id="toasts"></div>
</div>
<aside id="side" class="panel">
  <header><h2>Đội bot <small id="count"></small></h2><button id="sheetToggle" aria-label="Thu gọn">&#9662;</button></header>
  <div id="list"></div>
  <div id="groups" style="padding:0 10px 12px"></div>
</aside>
<noscript>Cần bật JavaScript để xem Grok Office.</noscript>
<script type="module" src="office.js"></script>
</body>
</html>
